<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 머니로그</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <header class="header">
    <div class="wrap header-in">
      <a class="brand" href="/"><span class="mark" aria-hidden="true">M</span>머니로그</a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>
  <main id="main" class="wrap narrow">
    <div class="card">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="login" aria-selected="true">로그인</button>
        <button type="button" role="tab" data-mode="signup" aria-selected="false">회원가입</button>
      </div>
      <form id="authform" class="form">
        <label for="un">아이디</label>
        <input id="un" name="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocapitalize="none" placeholder="영문·숫자·밑줄 3~20자">
        <label for="pw">비밀번호</label>
        <input id="pw" name="password" type="password" required minlength="8" maxlength="100" placeholder="8자 이상">
        <p id="hint" class="hint" hidden>가입하면 바로 로그인돼요. 비밀번호는 안전하게 암호화해서 저장해요.</p>
        <p id="msg" class="msg error" role="alert"></p>
        <button id="submit" class="btn primary block" type="submit">로그인</button>
      </form>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
