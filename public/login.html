<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 머니로그</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
  <header class="header">
    <div class="wrap header-in">
      <a class="brand" href="/"><span class="mark" aria-hidden="true">M</span>머니로그</a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>
  <main id="main" class="wrap narrow">
    <div class="card">
      <h1 class="page-title">운영자 로그인</h1>
      <form id="authform" class="form">
        <label for="un">아이디</label>
        <input id="un" name="username" autocomplete="username" required maxlength="20" autocapitalize="none">
        <label for="pw">비밀번호</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="100">
        <p id="msg" class="msg error" role="alert"></p>
        <button id="submit" class="btn primary block" type="submit">로그인</button>
      </form>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
